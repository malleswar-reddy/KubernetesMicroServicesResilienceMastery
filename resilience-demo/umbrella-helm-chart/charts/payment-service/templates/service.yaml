apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app: payment-service
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8082
      protocol: TCP
  selector:
    app: payment-service
    release: {{ .Release.Name }}
