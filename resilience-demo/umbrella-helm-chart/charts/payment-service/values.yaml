replicaCount: 1
image:
  repository: resilience/payment-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8082
env:
  INVESTMENT_SERVICE_URL: "http://investment-service:8083"
resources:
  requests:
    memory: "384Mi"
    cpu: "250m"
  limits:
    memory: "768Mi"
    cpu: "500m"
