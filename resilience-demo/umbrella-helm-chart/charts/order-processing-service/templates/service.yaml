apiVersion: v1
kind: Service
metadata:
  name: order-processing-service
  labels:
    app: order-processing-service
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8081
      protocol: TCP
  selector:
    app: order-processing-service
    release: {{ .Release.Name }}
