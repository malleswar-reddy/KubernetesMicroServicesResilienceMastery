replicaCount: 1
image:
  repository: resilience/order-processing-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8081
env:
  PAYMENT_SERVICE_URL: "http://payment-service:8082"
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"
