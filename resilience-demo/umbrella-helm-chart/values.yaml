order-processing-service:
  replicaCount: 2
  image:
    repository: resilience/order-processing-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  env:
    PAYMENT_SERVICE_URL: "http://payment-service:8082"

payment-service:
  replicaCount: 2
  image:
    repository: resilience/payment-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082
  env:
    INVESTMENT_SERVICE_URL: "http://investment-service:8083"

investment-service:
  replicaCount: 2
  image:
    repository: resilience/investment-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8083
