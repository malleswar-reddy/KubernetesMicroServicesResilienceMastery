global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yaml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'order-processing-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-processing-service:8081']

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-service:8082']

  - job_name: 'investment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['investment-service:8083']

  - job_name: 'jitter-tuner'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['jitter-tuner:8084']
